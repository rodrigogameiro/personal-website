name: External links

# Publisher and DOI sites rate-limit bots, so external links are checked weekly
# rather than on every push.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  links:
    name: Check external links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # LinkedIn and ResearchGate refuse automated requests; 403/429 mean "alive but blocking bots".
          args: >-
            --root-dir "${{ github.workspace }}/dist"
            --exclude '^https?://localhost'
            --exclude 'linkedin\.com'
            --exclude 'researchgate\.net'
            --accept '200..=299,403,429'
            --max-retries 3
            --no-progress
            'dist/**/*.html'
          fail: true
          jobSummary: true
